<script>
(function () {
  try {
    var params = new URLSearchParams(window.location.search);
    var preview = params.get('preview') === 'cover';
    if (preview) {
      document.documentElement.classList.add('deck-preview-cover');
    }
    var layout = params.get('layout') || params.get('format');
    if (layout === 'square' || params.get('linkedin') === 'square') {
      document.documentElement.classList.add('deck-square-layout');
    }
    var saved = parseInt(localStorage.getItem('coreldraw-macos-deck-position') || '0', 10);
    var startsOnDarkSlide = preview || isNaN(saved) || [0,3,7,12,17,19].indexOf(saved) !== -1;
    document.documentElement.classList.add(startsOnDarkSlide ? 'deck-starts-on-dark' : 'deck-starts-on-light');
  } catch (_) {
    document.documentElement.classList.add('deck-starts-on-dark');
  }
})();
</script>
<style>
  /* Critical pre-mount paint: keep the first frame on-theme while the bundle loads. */
  html.deck-starts-on-dark { background: #04150b; }
  html.deck-starts-on-light { background: #f8f8f9; }
</style>
