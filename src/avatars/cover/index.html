<head>

<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

<script>
// Cover-only deck for the home page preview card. The case page is /avatars/.
(function () {
  var params = new URLSearchParams(window.location.search);
  if (params.get('preview') !== 'cover') {
    window.location.replace('../');
    return;
  }
  document.documentElement.classList.add('deck-preview-cover', 'deck-starts-on-dark');
})();
</script>
<style>
  /* Critical pre-mount paint: keep the first frame on-theme while the bundle loads. */
  html.deck-starts-on-dark { background: #04140f; }
</style>
<link rel="stylesheet" href="/assets/deck-common.css">
</head>
<body class="chrome-boot deck-animations-pending">
  <div id="root"></div>
  <script type="module" src="../cover.tsx"></script>
</body>
</html>
