name: Deploy static site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for preview rendering
        run: npx playwright install --with-deps chromium

      - name: Build static site
        run: npm run build

      # Renders the mobile card posters and the CV PDF (/cv/Timur_Prokopiev_CV.pdf)
      # from the site just built, so every deploy ships a PDF of the current CV.
      - name: Generate mobile preview posters and the CV PDF
        run: npm run previews:build

      - name: Rebuild static site with fresh previews
        run: npm run build

      - name: Check the CV PDF is in the build
        run: test -s dist/cv/Timur_Prokopiev_CV.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying GitHub Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Retry deploy to GitHub Pages
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
