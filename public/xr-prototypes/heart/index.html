  <title>Heart Viewer — WebGL Prototype</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #1b2230; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #1b2230; outline: none; }
    .loading {
      position: fixed; inset: 0; display: grid; place-content: center; gap: 14px;
      color: #c9d2e3; font: 500 11px/1.6 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
      letter-spacing: 0.16em; text-transform: uppercase; text-align: center;
    }
    .loading[hidden] { display: none; }
    .bar { width: 180px; height: 3px; border-radius: 3px; background: rgb(255 255 255 / 0.14); overflow: hidden; }
    .bar > span { display: block; width: 0%; height: 100%; background: #9b5cf6; transition: width 120ms linear; }
    .error { max-width: 320px; letter-spacing: 0.04em; text-transform: none; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div class="loading" id="loading">
    <span id="loading-label">Loading prototype</span>
    <div class="bar"><span id="bar"></span></div>
  </div>

  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    const bar = document.getElementById('bar');
    const label = document.getElementById('loading-label');

    const config = {
      dataUrl: 'Build/heart.data',
      frameworkUrl: 'Build/heart.framework.js',
      codeUrl: 'Build/heart.wasm',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'Timur Prokopiev',
      productName: 'Heart Viewer',
      productVersion: '0.1.0',
      showBanner: (message, type) => { if (type === 'error') console.error(message); else console.warn(message); },
    };

    const script = document.createElement('script');
    script.src = 'Build/heart.loader.js';
    script.onload = () => {
      createUnityInstance(canvas, config, progress => { bar.style.width = `${100 * progress}%`; })
        .then(() => { loading.hidden = true; })
        .catch(message => {
          // Usually the device ran out of memory for the build (phones), which
          // Unity reports only as a bare "Script error."
          console.error(message);
          label.classList.add('error');
          label.textContent = "Couldn't start the prototype on this device. It needs a desktop browser with WebGL 2.";
          bar.parentElement.hidden = true;
        });
    };
    document.body.append(script);
  </script>
</body>
